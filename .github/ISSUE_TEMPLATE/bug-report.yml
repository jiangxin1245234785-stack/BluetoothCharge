name: "Bug report / 错误报告"
description: "Report a reproducible app, settings, tray, startup or notification problem. / 提交程序行为问题。"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        中文或英文均可。For missing devices or battery-protocol support, use the device compatibility form when possible.
        Issues are public. Remove personal device names, Bluetooth/MAC addresses, ContainerIds, serial numbers and local user paths from attachments. Please do not upload the entire application data folder.
  - type: input
    id: app-version
    attributes:
      label: "App version and package / 程序版本与包类型"
      placeholder: "Example: v0.1.3, win-x64 self-contained / light / source build"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: "Windows version and build / Windows 版本与内部版本号"
      description: "Use winver; omit computer/user names. / 可从 winver 查看，勿填写电脑名或用户名。"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction steps / 复现步骤"
      description: "Include relevant settings or connection context. For layout problems, include display scaling and window size. / 说明操作、相关设置或连接情况；布局问题请补充缩放比例和窗口大小。"
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior / 预期行为"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior / 实际行为"
      description: "For notifications, distinguish submission from a visible banner and mention Do Not Disturb. / 通知问题请区分提交成功与横幅是否显示，并说明勿扰设置。"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Sanitized error, logs or screenshots / 已脱敏的错误、日志或截图（可选）"
      description: "Share only the relevant excerpt. If using a screenshot, anonymize device names and identifying details. / 仅附必要片段；截图也请匿名化。"
  - type: textarea
    id: additional
    attributes:
      label: "Additional context / 补充信息（可选）"
      description: "For example, whether it started after an update or also occurs with an isolated configuration. / 例如是否在更新后出现、隔离配置下是否也能复现。"
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy check / 隐私检查"
      options:
        - label: "Any shared logs, diagnostics or screenshots have been checked for personal names, addresses, IDs, serial numbers and local paths. / 分享内容已检查并去除个人标识。"
          required: true
